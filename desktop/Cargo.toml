[package]
name = "agent-skyline-window"
version = "0.1.0"
edition = "2021"
description = "Agent Skyline in its own desktop window (specs/08)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
