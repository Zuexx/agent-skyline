name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      # The checkout goes into a folder with a space and non-ASCII characters on purpose:
      # the user's Windows machine has paths like that, and the tests must cope with them.
      - uses: actions/checkout@v4
        with:
          path: "ci test/agent-skyline 測試"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: "ci test/agent-skyline 測試"
